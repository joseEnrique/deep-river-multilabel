services:
  mongo:
    image: mongo:7
    container_name: distributed-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: distributed-backend:latest
    container_name: distributed-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      BACKEND_ADDR: ":8080"
      MONGO_URI:   "mongodb://mongo:27017"
      DB_PREFIX:   "experiments_"
      API_KEY:     "${API_KEY:?API_KEY must be set in .env}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
