# ── Agent identity & backend ─────────────────────────────────────────────────
backend_url: http://13.37.80.70:8080
api_key:     Golaso1992?        # null → reads $BACKEND_API_KEY (or no auth if backend has none)
agent_id:    null        # null → uses socket.gethostname()
dataset:     nps        # backend will use DB experiments_<dataset>

# GPUs this agent owns. One worker is spawned per device.
devices:
  - cuda:0

# Slots per GPU (concurrencia). Cada experimento usa 1 slot (LIGHT) o 2 (HEAVY)
# según su compute_score (ws · hd² · nl, ×1.5 si LSTM; umbral 6.8M).
# Dos LIGHT pueden compartir GPU; un HEAVY pide la GPU entera.
max_slots_per_device: 1 

# Override opcional por device (útil si una GPU tiene menos VRAM):
# slots_per_device:
#   cuda:0: 2
#   cuda:1: 1

# If true (default), each worker claims ANY pending experiment from the
# dataset (even if registered by another agent). The `device` field on a
# registered config is used as a SOFT preference for routing, never a hard
# filter. Set to false to restrict this agent to experiments it registered.
consume_any: true

# Local SQLite mirror — every state change (register, claim, checkpoint,
# finish, fail) is also written here. Acts as an offline log if the backend
# is unavailable. Defaults to ./local_<dataset>.db
local_db_path: null

checkpoint_every: 1000
poll_interval: 5         # seconds between empty-poll cycles

# ── Experiment grid (optional) ───────────────────────────────────────────────
# Same shape as experiment_system/config.yaml. Registration is idempotent:
# if another agent already registered a config, the backend returns 409 and
# we skip silently — nothing is overwritten.
#
# Omit this section entirely to run as a pure consumer (no grid, just claim
# whatever is pending in the dataset).

model:
  # ── LSTM
  - architecture:  [LSTM]
    device:        ["cuda:1"]
    optimizer:     [adam]
    past_history:  [1, 2, 5]
    window_size:   [1, 50, 200, 500]
    hidden_dim:    [64, 128]
    num_layers:    [1, 2]
    lr:            [0.01, 0.001]
    dropout:       [0.2, 0]
    bidirectional: [false]
    normalization: ["none", "layernorm"]
    seed:          [42]
    epochs:        [1, 3]

  # ── MLP (flattened sequence, bidirectional=False implicitly)
  - architecture:  [MLP]
    device:        ["cuda:1"]
    optimizer:     [adam]
    past_history:  [1, 2, 5]
    window_size:   [1, 50, 200, 500]
    hidden_dims:   [[128, 64, 32], [128, 64], [64, 32]]
    lr:            [0.01, 0.001, 0.0001]
    dropout:       [0.2, 0]
    normalization: ["none", "layernorm"]
    seed:          [42]
    epochs:        [1, 3]

  # ── CNN
  - architecture:  [CNN]
    device:        ["cuda:1"]
    optimizer:     [adam]
    past_history:  [1, 2, 5]
    window_size:   [1, 50, 200, 500]
    hidden_dim:    [64, 128]
    num_layers:    [1, 2]
    lr:            [0.01, 0.001, 0.0001]
    dropout:       [0.2, 0]
    normalization: ["none", "layernorm"]
    seed:          [42]
    epochs:        [1, 3]

  # ── Transformer
  - architecture:  [Transformer]
    device:        ["cuda:2"]
    optimizer:     [adam]
    past_history:  [1, 2, 5]
    window_size:   [1, 50, 200, 500]
    hidden_dim:    [32, 64, 128]
    num_layers:    [1, 2]
    lr:            [0.01, 0.001, 0.0001]
    dropout:       [0.2, 0]
    normalization: ["none", "layernorm"]
    seed:          [42]
    epochs:        [1, 3]

loss:
  - type: BCE

  # Ganador del sweep estático en NPS: Micro/Macro F1 = 99.77.
  - type: StaticFocal
    alpha: 0.25
    gamma: 2.0

  # Mejor variante del tuning adaptativo en NPS: Micro/Macro F1 = 99.76
  # (no supera al estático en NPS, pero la dejamos para comparar en otros datasets).
  - type: AdaptiveFocal
    base_gamma: 2.0
    base_alpha: 0.25
    decay: 0.9999
    alpha_gain: 0.5
    gamma_gain: 0.5
