# ── Agent identity & backend ─────────────────────────────────────────────────
backend_url: http://localhost:8080
api_key:     null        # null → reads $BACKEND_API_KEY (or no auth if backend has none)
agent_id:    null        # null → uses socket.gethostname()
dataset:     ai4i        # backend will use DB experiments_<dataset>

# GPUs this agent owns. One dispatcher thread per device.
devices:
  - cuda:0
  - cuda:1

# Slots per GPU (concurrencia). Tres tiers según compute_score
# (ws · hd² · nl + ws² · hd · nl · 0.2, escalado por ph · ep):
#   SMALL  (2 slots, ~50% GPU): score ≤ 1.5M
#   MEDIUM (2 slots, ~50% GPU): 1.5M < score ≤ 30M
#   LARGE  (4 slots, 100% GPU): score > 30M
# Default 4 slots/GPU → caben 2 SMALL, ó 2 MEDIUM, ó 1 LARGE (1 SMALL + 1 MEDIUM también).
max_slots_per_device: 4

# Override opcional por device (útil si una GPU tiene menos VRAM):
# slots_per_device:
#   cuda:0: 4
#   cuda:1: 2

# Orden en que cada worker elige entre los experimentos pendientes (dentro de
# la preferencia por device, que sigue mandando primero):
#   speed_asc (default) → primero los rápidos, por tier de duración según
#                         `epochs`:  FAST ep≤3  →  MEDIUM 3<ep<10  →  SLOW ep≥10.
#                         A igualdad de tier, modelo más pequeño primero.
#                         Con speed_*, el tier manda POR ENCIMA de la afinidad
#                         de device: un ep=1 de otra GPU adelanta a un ep=20
#                         asignado a ésta.
#   speed_desc          → los lentos primero (arrancar ya los runs largos).
#   size_asc            → solo por tamaño de modelo (compute_score = hd² · nl,
#                         + ws² · 0.5 en Transformer), ignorando epochs.
#   size_desc           → solo por tamaño, los grandes primero.
#   slots               → comportamiento antiguo: solo por slots_needed
#                         (SMALL/MEDIUM → LARGE), sin desempate.
# No afecta a cuántos slots consume nada: solo al orden de elección.
pick_order: speed_asc

# Cada worker se trae la cola de pending ENTERA (paginada) para poder ordenarla
# de verdad; el backend la sirve por `created_at` asc, así que una sola página
# ordenaría una ventana arbitraria del grid. Como son varios MB, se cachea este
# número de segundos en vez de refetchear en cada vuelta del bucle. Súbelo si
# el backend está lejos y hay muchos workers; bájalo para reaccionar antes a
# experimentos recién registrados.
candidate_cache_s: 60


# If true (default), each dispatcher claims ANY pending experiment from the
# dataset (even if registered by another agent). The `device` field on a
# registered config is used as a SOFT preference for routing, never a hard
# filter. Set to false to restrict this agent to experiments it registered.
consume_any: true

checkpoint_every: 1000
poll_interval: 5         # seconds between empty-poll cycles

# ── Experiment grid (optional) ───────────────────────────────────────────────
# Same shape as experiment_system/config.yaml. Registration is idempotent:
# if another agent already registered a config, the backend returns 409 and
# we skip silently — nothing is overwritten.
#
# Omit this section entirely to run as a pure consumer (no grid, just claim
# whatever is pending in the dataset).

model:
  - architecture:  [Transformer]
    device:        ["cuda:0"]
    optimizer:     [sgd, adam]
    past_history:  [10]
    window_size:   [200]
    hidden_dim:    [64]
    num_layers:    [1]
    lr:            [0.0001]
    dropout:       [0.2]
    bidirectional: [false]
    normalization: ["layernorm"]
    seed:          [42]
    epochs:        [1]

  - architecture:  [LSTM]
    device:        ["cuda:1"]
    optimizer:     [adam]
    past_history:  [1, 5]
    window_size:   [200]
    hidden_dim:    [64, 128]
    num_layers:    [1, 2]
    lr:            [0.001]
    dropout:       [0.2]
    bidirectional: [false]
    normalization: ["layernorm"]
    seed:          [42]
    epochs:        [1]

loss:
  - type: BCE
  - type: StaticFocal
    alpha: 0.25
    gamma: 2.0
  - type: AdaptiveFocal
    base_gamma: 2.0
    base_alpha: 0.25
    decay: 0.999
    alpha_gain: 1.0
    gamma_gain: 2.0
