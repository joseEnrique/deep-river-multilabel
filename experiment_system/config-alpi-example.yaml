# Ejemplo de grid de experimentos para el dataset ALPI.
#
# Cambios respecto a config.yaml (AI4I/NPS):
#   - dataset: alpi
#   - aparecen los parámetros del dataset (machine, input_win, output_win,
#     delta, sigma, min_count) que NewAlpi necesita para construir las ventanas.
#   - aparecen los parámetros de embedding (embedding_dim, num_alarms) que
#     consumen los modelos AlpiLSTM/AlpiMLP/AlpiCNN/AlpiTransformer.
#
# El runner detecta dataset=alpi y automáticamente:
#   - instancia NewAlpi con los kwargs (machine, input_win, ...)
#   - despacha LSTM→AlpiLSTM, MLP→AlpiMLP, CNN→AlpiCNN, Transformer→AlpiTransformer
#   - usa pipeline solo con SelectType(numbers.Number) (sin StandardScaler/OneHotEncoder)
#
# El vocabulario de ALPI tiene 154 alarmas + padding → num_alarms=155.

dataset: alpi

model:
  # ── LSTM
  - architecture:  [LSTM]
    dataset:       [alpi]
    device:        ["cuda:1"]
    optimizer:     [adam]
    # Dataset params
    machine:       [2]
    input_win:     [1720]
    output_win:    [480]
    delta:         [0]
    sigma:         [120]
    min_count:     [0]
    # Embedding
    num_alarms:    [155]
    embedding_dim: [8, 32]
    # Sequencer / clasificador
    past_history:  [1, 2, 5]
    window_size:   [1, 50, 200, 500]
    # Arquitectura
    hidden_dim:    [64, 128]
    num_layers:    [1, 2]
    lr:            [0.01, 0.001]
    dropout:       [0.2, 0]
    bidirectional: [false]
    normalization: ["none", "layernorm"]
    seed:          [42]
    epochs:        [1, 3]

  # ── MLP (la primera capa es LazyLinear: se ajusta a past_history × seq_len × embedding_dim)
  - architecture:  [MLP]
    dataset:       [alpi]
    device:        ["cuda:1"]
    optimizer:     [adam]
    machine:       [2]
    input_win:     [1720]
    output_win:    [480]
    delta:         [0]
    sigma:         [120]
    min_count:     [0]
    num_alarms:    [155]
    embedding_dim: [8, 32]
    past_history:  [1, 2, 5]
    window_size:   [1, 50, 200, 500]
    hidden_dims:   [[128, 64, 32], [128, 64], [64, 32]]
    lr:            [0.01, 0.001, 0.0001]
    dropout:       [0.2, 0]
    normalization: ["none", "layernorm"]
    seed:          [42]
    epochs:        [1, 3]

  # ── CNN (Conv1d sobre la secuencia de embeddings, max-pool global al final)
  - architecture:  [CNN]
    dataset:       [alpi]
    device:        ["cuda:1"]
    optimizer:     [adam]
    machine:       [2]
    input_win:     [1720]
    output_win:    [480]
    delta:         [0]
    sigma:         [120]
    min_count:     [0]
    num_alarms:    [155]
    embedding_dim: [8, 32]
    past_history:  [1, 2, 5]
    window_size:   [1, 50, 200, 500]
    hidden_dim:    [64, 128]
    num_layers:    [1, 2]
    lr:            [0.01, 0.001, 0.0001]
    dropout:       [0.2, 0]
    normalization: ["none", "layernorm"]
    seed:          [42]
    epochs:        [1, 3]

  # ── Transformer (encoder estándar sobre embeddings)
  - architecture:  [Transformer]
    dataset:       [alpi]
    device:        ["cuda:2"]
    optimizer:     [adam]
    machine:       [2]
    input_win:     [1720]
    output_win:    [480]
    delta:         [0]
    sigma:         [120]
    min_count:     [0]
    num_alarms:    [155]
    embedding_dim: [8, 32]
    past_history:  [1, 2, 5]
    window_size:   [1, 50, 200, 500]
    hidden_dim:    [32, 64, 128]
    num_layers:    [1, 2]
    lr:            [0.01, 0.001, 0.0001]
    dropout:       [0.2, 0]
    normalization: ["none", "layernorm"]
    seed:          [42]
    epochs:        [1, 3]

loss:
  - type: BCE

  - type: StaticFocal
    alpha: 0.25
    gamma: 2.0

  - type: AdaptiveFocal
    base_gamma: 2.0
    base_alpha: 0.25
    decay: 0.999
    alpha_gain: 1.0
    gamma_gain: 2.0

checkpoint_every: 1000
results_dir: results_alpi
db_path: experiments_alpi.db
final_results_file: results_alpi/final_results.csv
